<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generador de Atlas de Texturas</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <header class="page-header">
    <h1>Generador de Atlas de Texturas</h1>
  </header>

  <main class="container">
    <section class="toolbar card">
      <!-- Fila principal: aprovecha todo el espacio horizontal -->
      <div class="toolbar-row">
        <div class="control-group col-name">
          <label for="baseName">Nombre común (base)</label>
          <input type="text" id="baseName" class="input" value="Atlas" placeholder="Ej: MiPersonaje_Ropa" />
        </div>

        <div class="control-group col-mode">
          <label>Modo de trabajo</label>
          <div class="action-group" id="modeToggle">
            <button type="button" class="btn btn-sm" data-mode="single">Uno solo</button>
            <button type="button" class="btn btn-secondary btn-sm" data-mode="multi">Varios a la vez (PBR)</button>
          </div>
        </div>

        <div class="control-group col-select">
          <label for="resolution">Resolución</label>
          <select id="resolution" class="input">
            <option value="512">512 × 512 px</option>
            <option value="1024" selected>1024 × 1024 px</option>
            <option value="2048">2048 × 2048 px</option>
            <option value="4096">4096 × 4096 px</option>
          </select>
        </div>

        <div class="control-group col-select">
          <label for="gridPreset">Divisiones</label>
          <select id="gridPreset" class="input">
            <option value="2x2" selected>2 × 2 (4 slots)</option>
            <option value="3x3">3 × 3 (9 slots)</option>
            <option value="4x4">4 × 4 (16 slots)</option>
            <option value="5x5">5 × 5 (25 slots)</option>
            <option value="6x6">6 × 6 (36 slots)</option>
            <option value="8x8">8 × 8 (64 slots)</option>
          </select>
        </div>

        <div class="control-group col-bg">
          <label>Fondo del atlas</label>
          <div class="swatches" id="bgSwatches" role="radiogroup" aria-label="Colores de fondo">
            <button type="button" class="swatch-btn" data-color="#ffffff" aria-checked="true" title="Blanco" style="--sw: #ffffff"></button>
            <button type="button" class="swatch-btn" data-color="#cccccc" title="Gris claro" style="--sw: #cccccc"></button>
            <button type="button" class="swatch-btn" data-color="#808080" title="Gris medio" style="--sw: #808080"></button>
            <button type="button" class="swatch-btn" data-color="#000000" title="Negro" style="--sw: #000000"></button>
            <button type="button" class="swatch-btn" data-color="#8080ff" title="Normal Map (#8080ff)" style="--sw: #8080ff"></button>
            <button type="button" class="swatch-btn" data-color="#ff0000" title="Rojo" style="--sw: #ff0000"></button>
            <button type="button" class="swatch-btn" data-color="#00ff00" title="Verde" style="--sw: #00ff00"></button>
            <button type="button" class="swatch-btn" data-color="#0000ff" title="Azul" style="--sw: #0000ff"></button>

            <button type="button" class="btn btn-secondary btn-xs" id="bgTransparent" data-transparent="true">Transparente</button>

            <div class="color-picker-wrap" title="Elegir color personalizado">
              <button type="button" class="color-chip-gradient" aria-label="Elegir color"></button>
              <input type="color" id="bgColorPicker" value="#ffffff" class="color-input-native" />
            </div>
          </div>
        </div>

        <div class="control-group col-actions">
          <label>&nbsp;</label>
          <div class="action-group">
            <button type="button" class="btn btn-secondary" onclick="app.clearAll()">Limpiar Todo</button>
            <button type="button" class="btn" onclick="app.downloadAll()">⬇ Descargar Todo</button>
          </div>
        </div>
      </div>

      <!-- Fila de canales PBR (solo visible en modo multi) -->
      <div class="toolbar-row toolbar-channels" id="channelSelectorGroup" style="display: none;">
        <div class="control-group full-width">
          <label>Mapas activos <span class="label-sub">(se añade automáticamente el sufijo <code>_canal</code> al archivo)</span></label>
          <div class="channels-bar">
            <div class="channel-chips" id="channelChips"></div>
            <div class="custom-channel-box">
              <input type="text" id="customChannelInput" class="input input-sm" placeholder="Nuevo canal (ej: mask, height)..." />
              <button type="button" class="btn btn-secondary btn-sm" id="addCustomChannelBtn">+ Añadir</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="helper-banner card">
      <span class="helper-badge">Atajos</span>
      <span>Arrastra imágenes desde tu PC a cualquier celda • <strong>Doble clic</strong> en celda vacía para elegir archivo • <strong>Arrastra</strong> para intercambiar celdas • <strong>Clic derecho</strong> para vaciar celda.</span>
    </div>

    <section class="boards-grid" id="boardsContainer"></section>
  </main>

  <input type="file" id="cellFileInput" multiple accept="image/*" style="display:none" />

  <footer class="page-footer">
    <small>Hecho con ❤️ para tu flujo de trabajo</small>
  </footer>

  <script>
    const supportsCreateImageBitmap = 'createImageBitmap' in window;

    const DEFAULT_CHANNELS = [
      { id: 'diffuse',   label: 'Diffuse',   suffix: '_diffuse',   active: true },
      { id: 'ao',        label: 'AO',        suffix: '_ao',        active: true },
      { id: 'normal',    label: 'Normal',    suffix: '_normal',    active: true },
      { id: 'metallic',  label: 'Metallic',  suffix: '_metallic',  active: true },
      { id: 'roughness', label: 'Roughness', suffix: '_roughness', active: true },
      { id: 'emission',  label: 'Emission',  suffix: '_emission',  active: false },
      { id: 'opacity',   label: 'Opacity',   suffix: '_opacity',   active: false },
    ];

    class AtlasBoard {
      constructor(manager, config) {
        this.manager = manager;
        this.id = config.id;
        this.label = config.label;
        this.suffix = config.suffix;

        this.slots = new Map();

        this.highlightedSlot = null;
        this.isDragging = false;
        this.dragSourceCell = null;

        this.needsDrawAtlas = false;
        this.needsDrawGrid = false;
        this._rafId = null;

        this.createDOM();
        this.updateCanvasSize();
        this.scheduleDrawGrid();
        this.scheduleDrawAtlas();
      }

      createDOM() {
        this.el = document.createElement('div');
        this.el.className = 'atlas-board card';

        this.el.innerHTML = `
          <div class="board-header">
            <div class="board-title-group">
              <h3 class="board-title">${this.label}</h3>
              <span class="board-filename" id="fname_${this.id}"></span>
            </div>
            <div class="board-header-actions">
              <button class="btn btn-secondary btn-sm" type="button" title="Vaciar este cuadro" data-action="clear">Limpiar</button>
              <button class="btn btn-sm" type="button" title="Descargar este atlas" data-action="download">Descargar</button>
            </div>
          </div>
          <div class="canvas-wrapper">
            <canvas class="atlas-canvas-el" width="${this.manager.resolution}" height="${this.manager.resolution}"></canvas>
            <canvas class="grid-overlay" width="${this.manager.resolution}" height="${this.manager.resolution}"></canvas>
          </div>
        `;

        this.canvas = this.el.querySelector('.atlas-canvas-el');
        this.ctx = this.canvas.getContext('2d', { alpha: true });
        this.gridCanvas = this.el.querySelector('.grid-overlay');
        this.gridCtx = this.gridCanvas.getContext('2d', { alpha: true });
        this.filenameEl = this.el.querySelector('.board-filename');

        this.el.querySelector('[data-action="clear"]').addEventListener('click', () => this.clear());
        this.el.querySelector('[data-action="download"]').addEventListener('click', () => this.download());

        this.canvas.addEventListener('dragover', (e) => this.handleDragOver(e));
        this.canvas.addEventListener('drop', (e) => this.handleDrop(e));
        this.canvas.addEventListener('dragleave', () => this.clearHighlight());

        this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
        this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e), { passive: true });
        this.canvas.addEventListener('mouseup', (e) => this.handleMouseUp(e), { passive: true });
        this.canvas.addEventListener('mouseleave', () => this.cancelDrag(), { passive: true });

        this.canvas.addEventListener('dblclick', (e) => this.handleDoubleClick(e));

        this.canvas.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const { gridX, gridY } = this.getGridFromEvent(e);
          const key = `${gridX},${gridY}`;
          if (this.slots.has(key)) {
            this.slots.delete(key);
            this.scheduleDrawAtlas();
          }
        });

        this.updateFilenamePreview();
      }

      getOutputFilename() {
        const base = (this.manager.baseName || 'Atlas').trim() || 'Atlas';
        if (this.manager.mode === 'single') {
          return `${base}.png`;
        }
        return `${base}${this.suffix}.png`;
      }

      updateFilenamePreview() {
        if (this.filenameEl) {
          this.filenameEl.textContent = this.getOutputFilename();
        }
      }

      updateCanvasSize() {
        const res = this.manager.resolution;
        this.canvas.width = res;
        this.canvas.height = res;
        this.gridCanvas.width = res;
        this.gridCanvas.height = res;
      }

      scheduleDrawGrid() { this.needsDrawGrid = true; this.requestFrame(); }
      scheduleDrawAtlas() { this.needsDrawAtlas = true; this.requestFrame(); }

      requestFrame() {
        if (this._rafId !== null) return;
        this._rafId = requestAnimationFrame(() => {
          this._rafId = null;
          if (this.needsDrawGrid) { this.drawGrid(); this.needsDrawGrid = false; }
          if (this.needsDrawAtlas) { this.drawAtlas(); this.needsDrawAtlas = false; }
        });
      }

      drawGrid() {
        const g = this.gridCtx;
        const res = this.manager.resolution;
        const gx = this.manager.gridX;
        const gy = this.manager.gridY;

        g.clearRect(0, 0, res, res);
        g.strokeStyle = 'rgba(255, 77, 77, 0.78)';
        g.lineWidth = Math.max(2, res / 512);

        const cw = res / gx;
        const ch = res / gy;

        for (let i = 1; i < gx; i++) {
          const x = i * cw;
          g.beginPath(); g.moveTo(x, 0); g.lineTo(x, res); g.stroke();
        }
        for (let i = 1; i < gy; i++) {
          const y = i * ch;
          g.beginPath(); g.moveTo(0, y); g.lineTo(res, y); g.stroke();
        }
      }

      drawAtlas() {
        const ctx = this.ctx;
        const res = this.manager.resolution;
        const gx = this.manager.gridX;
        const gy = this.manager.gridY;

        ctx.clearRect(0, 0, res, res);

        if (!this.manager.backgroundTransparent) {
          ctx.fillStyle = this.manager.backgroundColor || '#ffffff';
          ctx.fillRect(0, 0, res, res);
        }

        const cw = res / gx;
        const ch = res / gy;

        for (const [key, item] of this.slots.entries()) {
          const [cx, cy] = key.split(',').map(Number);
          if (cx >= gx || cy >= gy) continue;
          const x = cx * cw;
          const y = cy * ch;

          if (this.isDragging && this.dragSourceCell && this.dragSourceCell.gridX === cx && this.dragSourceCell.gridY === cy) {
            ctx.save();
            ctx.globalAlpha = 0.35;
            ctx.drawImage(item.img, x, y, cw, ch);
            ctx.restore();
            ctx.strokeStyle = '#00a2ff';
            ctx.setLineDash([8, 6]);
            ctx.lineWidth = Math.max(2, res / 256);
            ctx.strokeRect(x + 2, y + 2, cw - 4, ch - 4);
            ctx.setLineDash([]);
          } else {
            ctx.drawImage(item.img, x, y, cw, ch);
          }
        }

        if (this.highlightedSlot) {
          const x = this.highlightedSlot.gridX * cw;
          const y = this.highlightedSlot.gridY * ch;
          ctx.fillStyle = 'rgba(0, 162, 255, 0.25)';
          ctx.fillRect(x, y, cw, ch);
        }
      }

      validCell(gx, gy) {
        return gx >= 0 && gy >= 0 && gx < this.manager.gridX && gy < this.manager.gridY;
      }

      getGridFromEvent(event) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.manager.resolution / rect.width;
        const scaleY = this.manager.resolution / rect.height;
        const x = (event.clientX - rect.left) * scaleX;
        const y = (event.clientY - rect.top) * scaleY;
        const cw = this.manager.resolution / this.manager.gridX;
        const ch = this.manager.resolution / this.manager.gridY;
        return { gridX: Math.floor(x / cw), gridY: Math.floor(y / ch) };
      }

      handleDragOver(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
        const { gridX, gridY } = this.getGridFromEvent(event);
        if (this.validCell(gridX, gridY)) {
          this.highlightedSlot = { gridX, gridY };
          this.scheduleDrawAtlas();
        }
      }

      async handleDrop(event) {
        event.preventDefault();
        const files = Array.from(event.dataTransfer.files).filter(f => f.type.startsWith('image/'));
        if (files.length > 0) {
          const { gridX, gridY } = this.getGridFromEvent(event);
          if (this.validCell(gridX, gridY)) {
            await this.placeFilesStartingAt(files, gridX, gridY);
          }
        }
        this.clearHighlight();
      }

      async placeFilesStartingAt(files, startX, startY) {
        const gx = this.manager.gridX;
        const gy = this.manager.gridY;
        let currentIndex = startY * gx + startX;
        const maxCells = gx * gy;

        for (const file of files) {
          if (currentIndex >= maxCells) break;
          const cellX = currentIndex % gx;
          const cellY = Math.floor(currentIndex / gx);
          const imgEl = await this.manager.decodeImage(file);
          if (imgEl) {
            this.slots.set(`${cellX},${cellY}`, { img: imgEl, name: file.name });
          }
          currentIndex++;
        }
        this.scheduleDrawAtlas();
      }

      handleMouseDown(event) {
        if (event.button !== 0) return;
        const { gridX, gridY } = this.getGridFromEvent(event);
        const key = `${gridX},${gridY}`;
        if (this.slots.has(key)) {
          this.isDragging = true;
          this.dragSourceCell = { gridX, gridY };
          this.canvas.style.cursor = 'grabbing';
          this.scheduleDrawAtlas();
        }
      }

      handleMouseMove(event) {
        if (!this.isDragging) return;
        const { gridX, gridY } = this.getGridFromEvent(event);
        if (this.validCell(gridX, gridY)) {
          this.highlightedSlot = { gridX, gridY };
        } else {
          this.highlightedSlot = null;
        }
        this.scheduleDrawAtlas();
      }

      handleMouseUp() {
        if (this.isDragging && this.highlightedSlot && this.dragSourceCell) {
          const srcKey = `${this.dragSourceCell.gridX},${this.dragSourceCell.gridY}`;
          const dstKey = `${this.highlightedSlot.gridX},${this.highlightedSlot.gridY}`;
          if (srcKey !== dstKey && this.slots.has(srcKey)) {
            const srcItem = this.slots.get(srcKey);
            if (this.slots.has(dstKey)) {
              const dstItem = this.slots.get(dstKey);
              this.slots.set(srcKey, dstItem);
              this.slots.set(dstKey, srcItem);
            } else {
              this.slots.set(dstKey, srcItem);
              this.slots.delete(srcKey);
            }
          }
        }
        this.cancelDrag();
      }

      cancelDrag() {
        if (!this.isDragging && !this.highlightedSlot) return;
        this.isDragging = false;
        this.dragSourceCell = null;
        this.canvas.style.cursor = 'grab';
        this.clearHighlight();
      }

      handleDoubleClick(event) {
        const { gridX, gridY } = this.getGridFromEvent(event);
        if (!this.validCell(gridX, gridY)) return;
        const key = `${gridX},${gridY}`;
        if (this.slots.has(key)) {
          this.slots.delete(key);
          this.scheduleDrawAtlas();
        } else {
          this.manager.openFilePickerForCell(this, gridX, gridY);
        }
      }

      clearHighlight() {
        this.highlightedSlot = null;
        this.scheduleDrawAtlas();
      }

      clear() {
        this.slots.clear();
        this.scheduleDrawAtlas();
      }

      download() {
        const prevHighlight = this.highlightedSlot;
        const prevDragging = this.isDragging;
        this.highlightedSlot = null;
        this.isDragging = false;
        this.drawAtlas();

        const link = document.createElement('a');
        link.download = this.getOutputFilename();
        link.href = this.canvas.toDataURL('image/png');
        link.click();

        this.highlightedSlot = prevHighlight;
        this.isDragging = prevDragging;
        this.scheduleDrawAtlas();
      }
    }

    class AtlasApp {
      constructor() {
        this.mode = 'single';
        this.baseName = 'Atlas';
        this.resolution = 1024;
        this.gridX = 2;
        this.gridY = 2;
        this.backgroundTransparent = false;
        this.backgroundColor = '#ffffff';

        this.channels = DEFAULT_CHANNELS.map(c => ({ ...c }));
        this.boards = new Map();
        this.singleBoard = null;

        this.pendingPickerTarget = null;

        this.setupEventListeners();
        this.renderChannelChips();
        this.rebuildBoardsView();
      }

      setupEventListeners() {
        const baseNameInput = document.getElementById('baseName');
        baseNameInput.addEventListener('input', (e) => {
          this.baseName = e.target.value;
          this.updateAllFilenames();
        });

        document.getElementById('modeToggle').addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-mode]');
          if (!btn) return;
          this.mode = btn.dataset.mode;
          document.querySelectorAll('#modeToggle button[data-mode]').forEach(b => {
            if (b === btn) {
              b.classList.remove('btn-secondary');
            } else {
              b.classList.add('btn-secondary');
            }
          });
          document.getElementById('channelSelectorGroup').style.display = this.mode === 'multi' ? '' : 'none';
          this.rebuildBoardsView();
        });

        const addChannel = () => {
          const input = document.getElementById('customChannelInput');
          const raw = input.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
          if (!raw) return;
          const id = raw.replace(/^_+/, '');
          if (!id) return;
          const existing = this.channels.find(c => c.id === id);
          if (existing) {
            existing.active = true;
          } else {
            const label = id.charAt(0).toUpperCase() + id.slice(1);
            this.channels.push({ id, label, suffix: `_${id}`, active: true });
          }
          input.value = '';
          this.renderChannelChips();
          this.rebuildBoardsView();
        };
        document.getElementById('addCustomChannelBtn').addEventListener('click', addChannel);
        document.getElementById('customChannelInput').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); addChannel(); }
        });

        document.getElementById('resolution').addEventListener('change', (e) => {
          this.resolution = parseInt(e.target.value, 10);
          this.forEachBoard(b => {
            b.updateCanvasSize();
            b.scheduleDrawGrid();
            b.scheduleDrawAtlas();
          });
        });

        document.getElementById('gridPreset').addEventListener('change', (e) => {
          const [gx, gy] = e.target.value.split('x').map(n => parseInt(n, 10));
          this.gridX = gx;
          this.gridY = gy;
          this.forEachBoard(b => {
            b.scheduleDrawGrid();
            b.scheduleDrawAtlas();
          });
        });

        const swatchContainer = document.getElementById('bgSwatches');
        swatchContainer.addEventListener('click', (e) => {
          const btn = e.target.closest('.swatch-btn');
          const chip = e.target.closest('#bgTransparent');
          if (btn) {
            this.backgroundTransparent = false;
            this.backgroundColor = btn.dataset.color;
            document.getElementById('bgColorPicker').value = this.toHex(this.backgroundColor);
            this.updateSwatchUI(btn);
            this.forEachBoard(b => b.scheduleDrawAtlas());
          } else if (chip) {
            this.backgroundTransparent = true;
            this.updateSwatchUI(chip);
            this.forEachBoard(b => b.scheduleDrawAtlas());
          }
        });

        document.getElementById('bgColorPicker').addEventListener('input', (e) => {
          this.backgroundTransparent = false;
          this.backgroundColor = e.target.value;
          this.updateSwatchUI(e.target);
          this.forEachBoard(b => b.scheduleDrawAtlas());
        });

        const cellFileInput = document.getElementById('cellFileInput');
        cellFileInput.addEventListener('change', async (e) => {
          const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
          if (files.length > 0 && this.pendingPickerTarget) {
            const { board, gridX, gridY } = this.pendingPickerTarget;
            await board.placeFilesStartingAt(files, gridX, gridY);
          }
          this.pendingPickerTarget = null;
          e.target.value = '';
        });
      }

      openFilePickerForCell(board, gridX, gridY) {
        this.pendingPickerTarget = { board, gridX, gridY };
        document.getElementById('cellFileInput').click();
      }

      async decodeImage(file) {
        try {
          if (supportsCreateImageBitmap) {
            const bmp = await createImageBitmap(file);
            const off = document.createElement('canvas');
            off.width = bmp.width;
            off.height = bmp.height;
            off.getContext('2d').drawImage(bmp, 0, 0);
            const imgEl = new Image();
            imgEl.src = off.toDataURL();
            await new Promise(res => imgEl.onload = res);
            return imgEl;
          } else {
            const imgEl = new Image();
            imgEl.src = URL.createObjectURL(file);
            await new Promise(res => imgEl.onload = res);
            URL.revokeObjectURL(imgEl.src);
            return imgEl;
          }
        } catch (err) {
          console.error('Error cargando imagen:', err);
          return null;
        }
      }

      renderChannelChips() {
        const container = document.getElementById('channelChips');
        container.innerHTML = '';
        this.channels.forEach(ch => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `btn btn-xs ${ch.active ? '' : 'btn-secondary'}`;
          btn.innerHTML = `${ch.label} <small>${ch.suffix}</small>`;
          btn.addEventListener('click', () => {
            const activeCount = this.channels.filter(c => c.active).length;
            if (ch.active && activeCount <= 1) return;
            ch.active = !ch.active;
            this.renderChannelChips();
            this.rebuildBoardsView();
          });
          container.appendChild(btn);
        });
      }

      rebuildBoardsView() {
        const container = document.getElementById('boardsContainer');
        container.innerHTML = '';

        if (this.mode === 'single') {
          container.classList.add('single-mode');
          if (!this.singleBoard) {
            this.singleBoard = new AtlasBoard(this, { id: 'single', label: 'Atlas Único', suffix: '' });
          }
          this.singleBoard.updateCanvasSize();
          this.singleBoard.updateFilenamePreview();
          this.singleBoard.scheduleDrawGrid();
          this.singleBoard.scheduleDrawAtlas();
          container.appendChild(this.singleBoard.el);
        } else {
          container.classList.remove('single-mode');
          const activeChannels = this.channels.filter(c => c.active);
          activeChannels.forEach(ch => {
            let board = this.boards.get(ch.id);
            if (!board) {
              board = new AtlasBoard(this, ch);
              this.boards.set(ch.id, board);
            }
            board.updateCanvasSize();
            board.updateFilenamePreview();
            board.scheduleDrawGrid();
            board.scheduleDrawAtlas();
            container.appendChild(board.el);
          });
        }
      }

      getActiveBoards() {
        if (this.mode === 'single') {
          return this.singleBoard ? [this.singleBoard] : [];
        }
        return this.channels
          .filter(c => c.active)
          .map(c => this.boards.get(c.id))
          .filter(Boolean);
      }

      forEachBoard(fn) {
        if (this.singleBoard) fn(this.singleBoard);
        for (const b of this.boards.values()) fn(b);
      }

      updateAllFilenames() {
        this.forEachBoard(b => b.updateFilenamePreview());
      }

      clearAll() {
        this.getActiveBoards().forEach(b => b.clear());
      }

      downloadAll() {
        const active = this.getActiveBoards();
        active.forEach((board, idx) => {
          setTimeout(() => board.download(), idx * 180);
        });
      }

      toHex(color) {
        if (color.startsWith('#')) return color;
        const m = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/i);
        if (!m) return '#ffffff';
        const [r, g, b] = m.slice(1).map(n => parseInt(n, 10));
        return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
      }

      updateSwatchUI(activeEl) {
        document.querySelectorAll('.swatch-btn').forEach(b => b.setAttribute('aria-checked', 'false'));
        const transBtn = document.getElementById('bgTransparent');
        transBtn.classList.add('btn-secondary');
        if (activeEl.classList && activeEl.classList.contains('swatch-btn')) {
          activeEl.setAttribute('aria-checked', 'true');
        }
        if (activeEl.id === 'bgTransparent') {
          transBtn.classList.remove('btn-secondary');
        }
      }
    }

    const app = new AtlasApp();
  </script>
</body>
</html>
